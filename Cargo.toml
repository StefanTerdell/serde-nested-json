[package]
name = "serde-nested-json"
version = "0.1.3"
authors = ["Stefan Terdell"]
edition = "2021"
license = "ISC"
description = "Helpers for de/serializing nested JSON strings with Serde"
repository = "https://github.com/StefanTerdell/serde-nested-json"
homepage = "https://crates.io/crates/serde-nested-json"
documentation = "https://docs.rs/serde-nested-json"
readme = "README.md"

[dependencies]
schemars1 = { package = "schemars", version = "1", optional = true }
schemars08 = { package = "schemars", version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["schemars08", "schemars1"]

[dev-dependencies]
pretty_assertions = "1.4.1"
